<div
  class="w-full h-11 flex flex-row gap-1 p-1 overflow-y-hidden whitespace-nowrap sk-thin-scrollbar"
>
  <sk-button text="Add Player" icon="person_add" type="positive" (action)="addPlayer()" />
  <sk-button text="Add Round" icon="add_row_below" type="positive" (action)="addRound()" />
  <sk-button
    text="Notes"
    icon="notes"
    [type]="state.notes() === '' ? 'positive' : 'notice'"
    (action)="openNotes()"
  />
  <sk-button
    [text]="isEditMode() ? 'Exit Edit Mode' : 'Enter Edit Mode'"
    [icon]="isEditMode() ? 'edit_off' : 'edit'"
    (action)="toggleEditMode()"
  />
  <sk-button text="Undo" icon="undo" (action)="undo()" [disabled]="!undoService.isUndoEnabled()" />
  <sk-button
    text="Reset"
    icon="delete_forever"
    type="danger"
    (action)="state.reset()"
    [disabled]="state.isInitialState()"
  />
  <sk-button
    [text]="actionsPosition() === 'top' ? 'Move To Bottom' : 'Move To Top'"
    [icon]="actionsPosition() === 'top' ? 'vertical_align_bottom' : 'vertical_align_top'"
    (action)="toggleActionsPosition()"
  />
</div>
<sk-notes [actionsPosition]="actionsPosition()" />
