<div
  [class]="`flex gap-1 p-1 whitespace-nowrap sk-thin-scrollbar ${isActionsPositionVertical() ? 'w-11 h-dvh flex-col overflow-x-hidden' : 'w-full h-11 flex-row overflow-y-hidden'}`"
>
  <sk-button
    text="Add Player"
    icon="person_add"
    type="positive"
    (action)="addPlayer()"
    [showText]="!isActionsPositionVertical()"
  />
  <sk-button
    text="Add Round"
    icon="add_row_below"
    type="positive"
    (action)="addRound()"
    [showText]="!isActionsPositionVertical()"
  />
  <sk-button
    text="Notes"
    icon="notes"
    [type]="state.notes() === '' ? 'positive' : 'notice'"
    (action)="openNotes()"
    [showText]="!isActionsPositionVertical()"
  />
  <sk-button
    [text]="isEditMode() ? 'Exit Edit Mode' : 'Enter Edit Mode'"
    [icon]="isEditMode() ? 'edit_off' : 'edit'"
    (action)="toggleEditMode()"
    [showText]="!isActionsPositionVertical()"
  />
  <sk-button
    text="Undo"
    icon="undo"
    (action)="undo()"
    [disabled]="!undoService.isUndoEnabled()"
    [showText]="!isActionsPositionVertical()"
  />
  <sk-button
    text="Reset"
    icon="delete_forever"
    type="danger"
    (action)="state.reset()"
    [disabled]="state.isInitialState()"
    [showText]="!isActionsPositionVertical()"
  />
  <select
    [value]="actions.position()"
    (change)="changeActionsPosition($event)"
    class="h-9"
    title="Change Position"
  >
    <option value="top">Top</option>
    <option value="bottom">Bottom</option>
    <option value="left">Left</option>
    <option value="right">Right</option>
  </select>
</div>
<sk-notes />
