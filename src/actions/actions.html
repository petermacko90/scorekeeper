<div
  [class]="`flex gap-1 p-1 whitespace-nowrap sk-thin-scrollbar ${isActionsPositionVertical() ? 'w-11 h-dvh flex-col overflow-x-hidden' : 'w-full h-11 flex-row overflow-y-hidden'}`"
>
  <sk-button
    text="Add Player"
    icon="person_add"
    type="positive"
    (action)="addPlayer()"
    [showText]="!isActionsPositionVertical()"
    [hideTextOnSmallScreen]="true"
  />
  <sk-button
    text="Add Round"
    icon="add_row_below"
    type="positive"
    (action)="addRound()"
    [showText]="!isActionsPositionVertical()"
    [hideTextOnSmallScreen]="true"
  />
  <sk-button
    text="Notes"
    icon="notes"
    [type]="state.notes() === '' ? 'positive' : 'notice'"
    (action)="openNotes()"
    [showText]="!isActionsPositionVertical()"
    [hideTextOnSmallScreen]="true"
  />
  <sk-button
    [text]="editMode.isEditMode() ? 'Exit Edit Mode' : 'Enter Edit Mode'"
    [icon]="editMode.isEditMode() ? 'edit_off' : 'edit'"
    (action)="editMode.toggleEditMode()"
    [showText]="!isActionsPositionVertical()"
    [hideTextOnSmallScreen]="true"
  />
  <sk-button
    text="Undo"
    icon="undo"
    (action)="undo()"
    [disabled]="!undoService.isUndoEnabled()"
    [showText]="!isActionsPositionVertical()"
    [hideTextOnSmallScreen]="true"
  />
  <sk-button
    text="Reset"
    icon="delete_forever"
    type="danger"
    (action)="state.reset()"
    [disabled]="state.isInitialState()"
    [showText]="!isActionsPositionVertical()"
    [hideTextOnSmallScreen]="true"
  />
  <sk-button text="More" icon="more_vert" [showText]="false" (action)="openSettings()" />
</div>
<sk-notes />
<sk-settings />
