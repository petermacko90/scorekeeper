<div
  class="w-full h-11 flex flex-row gap-1 p-1 overflow-x-scroll whitespace-nowrap sk-no-scrollbar"
>
  <sk-button text="Add Player" icon="person_add" type="positive" (action)="state.addPlayer()" />
  <sk-button text="Add Round" icon="add_row_below" type="positive" (action)="state.addRound()" />
  <sk-button
    [text]="isEditMode() ? 'Exit Edit Mode' : 'Enter Edit Mode'"
    [icon]="isEditMode() ? 'edit_off' : 'edit'"
    (action)="toggleEditMode()"
  />
  <sk-button text="Undo" icon="undo" (action)="state.undo()" [disabled]="!state.isUndoEnabled()" />
  <sk-button
    text="Reset"
    icon="delete_forever"
    type="danger"
    (action)="state.reset()"
    [disabled]="state.isInitialState()"
  />
</div>
