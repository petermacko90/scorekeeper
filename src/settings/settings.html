<sk-dialog heading="Settings">
  <div class="flex flex-col gap-3">
    <sk-select
      id="actions-position"
      label="Actions Position:"
      [field]="settingsForm.actionsPosition()"
      [options]="positionOptions"
      (selectionChanged)="changeActionsPosition($event)"
    />
    <sk-select
      id="theme"
      label="Theme:"
      [field]="settingsForm.theme()"
      [options]="themeOptions"
      (selectionChanged)="changeTheme($event)"
    />
  </div>

  <div class="flex gap-3 mt-3">
    <sk-button text="Close" icon="cancel" (action)="close()" />
  </div>
</sk-dialog>
