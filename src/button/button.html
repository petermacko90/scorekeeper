<button
  (click)="action.emit()"
  [title]="text()"
  [disabled]="disabled()"
  class="h-full px-1.5 hover:opacity-75 active:opacity-50 text-polar-night-1 font-bold rounded-sm focus:outline-solid focus:outline-2 outline-polar-night-4 dark:outline-snow-storm-3"
  [class.bg-frost-1]="type() === 'default'"
  [class.bg-aurora-red]="type() === 'danger'"
  [class.bg-aurora-green]="type() === 'positive'"
  [class.bg-aurora-yellow]="type() === 'notice'"
  [class.opacity-50]="disabled()"
  [class.cursor-pointer]="!disabled()"
  [class.cursor-not-allowed]="disabled()"
>
  <span class="material-symbols-outlined align-middle">{{ icon() }}</span>
</button>
