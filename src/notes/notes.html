<sk-dialog>
  <label for="notes" class="block text-polar-night-1 dark:text-snow-storm-3 font-bold">Notes</label>
  <textarea
    id="notes"
    [formField]="state.scorekeeperForm.notes"
    (change)="undoService.clearPrevState()"
    autofocus
    rows="5"
    class="w-full p-1 field-sizing-content bg-snow-storm-1 dark:bg-polar-night-2 text-polar-night-1 dark:text-snow-storm-3 rounded-sm focus:outline-solid focus:outline-2 outline-polar-night-4 dark:outline-snow-storm-3 selection:bg-frost-4 selection:text-snow-storm-3"
  ></textarea>

  <div class="mt-2">
    <sk-button text="Close" icon="cancel" (action)="close()" />
  </div>
</sk-dialog>
