<dialog
  class="sm:left-11 w-full top-11 sm:w-sm mx-auto sm:m-0 py-2 px-3 rounded-md bg-snow-storm-2 dark:bg-polar-night-4 shadow-md"
  [class.sm:top-11]="actionsPosition() === 'top'"
  [class.sm:bottom-11]="actionsPosition() === 'bottom'"
  [class.sm:top-auto]="actionsPosition() === 'bottom'"
>
  <button
    (click)="close()"
    class="absolute top-1 right-1 w-6 h-6 text-sm text-aurora-red hover:opacity-75 active:opacity-50 cursor-pointer rounded-sm focus:outline-solid focus:outline-2 outline-polar-night-4 dark:outline-snow-storm-3"
    title="Close"
  >
    <span class="material-symbols-outlined align-middle">cancel</span>
  </button>
  <label for="notes" class="block text-polar-night-1 dark:text-snow-storm-3 font-bold">Notes</label>
  <textarea
    id="notes"
    [formField]="state.scorekeeperForm.notes"
    (change)="undoService.clearPrevState()"
    autofocus
    rows="5"
    class="w-full p-1 field-sizing-content bg-snow-storm-1 dark:bg-polar-night-2 text-polar-night-1 dark:text-snow-storm-3 rounded-sm focus:outline-solid focus:outline-2 outline-polar-night-4 dark:outline-snow-storm-3 selection:bg-frost-4 selection:text-snow-storm-3"
  ></textarea>
</dialog>
